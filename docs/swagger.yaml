basePath: /
definitions:
  dto.AddFavouriteRequest:
    properties:
      assetID:
        type: string
    required:
    - assetID
    type: object
  dto.UpdateFavouriteDescriptionRequest:
    properties:
      description:
        type: string
    required:
    - description
    type: object
host: localhost:8080
info:
  contact:
    email: daniilfanis@gmail.com
    name: F. Daniil
  description: This is a simple API for managing user favourite assets.
  title: GWI Favourite Assets API
  version: "1.0"
paths:
  /users/{userID}/favourites:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of all favourite assets for a given
        user.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10)'
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items: {}
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a user's favourites
      tags:
      - favourites
    post:
      consumes:
      - application/json
      description: Adds a new asset to a user's favourites list.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - description: Favourite request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddFavouriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add an asset to a user's favourites
      tags:
      - favourites
  /users/{userID}/favourites/{assetID}:
    delete:
      consumes:
      - application/json
      description: Removes a specific asset from a user's favourites list.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - description: Asset ID
        in: path
        name: assetID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a favourite asset
      tags:
      - favourites
    patch:
      consumes:
      - application/json
      description: Updates the description of a specific favourite asset.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - description: Asset ID
        in: path
        name: assetID
        required: true
        type: string
      - description: Update description payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateFavouriteDescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a favourite's description
      tags:
      - favourites
swagger: "2.0"
