services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: favourites-api:local
    container_name: favourites-api
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      ENV: "development"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
