version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gwi-app
    ports:
      - "8080:8080"
    environment:
      DB_ADDRESS: "postgres:5432"
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "./main" ]
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: gwi-postgres
    environment:
      POSTGRES_USER: gwi
      POSTGRES_PASSWORD: gwi
      POSTGRES_DB: gwi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gwi -d gwi" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: