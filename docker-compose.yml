services:
  favourites-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: favourites-api
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - APP_ENV=${APP_ENV:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
