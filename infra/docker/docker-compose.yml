version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_gwi
    environment:
      POSTGRES_USER: gwi
      POSTGRES_PASSWORD: gwi
      POSTGRES_DB: gwi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./../postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwi -d gwi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: